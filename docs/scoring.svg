<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect width="900" height="450" rx="16" fill="#ffffff"/>
  <text x="30" y="40" font-size="18" font-weight="bold" fill="#222">1. Credit for one part of an answer, along the record</text>
  <line x1="40" y1="118" x2="870" y2="118" stroke="#555" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="866" y="104" text-anchor="end" font-size="12" fill="#666">time</text>
    <circle cx="95" cy="118" r="20" fill="#9aa0a6"/>
  <text x="95" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">0.15</text>
  <text x="95" y="176" text-anchor="middle" font-size="13" fill="#333">the command</text>
  <text x="95" y="193" text-anchor="middle" font-size="13" fill="#333">that fetched it</text>
  <circle cx="265" cy="118" r="26" fill="#e8870e"/>
  <text x="265" y="123" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">0.5</text>
  <text x="265" y="176" text-anchor="middle" font-size="13" fill="#333">what came back:</text>
  <text x="265" y="193" text-anchor="middle" font-size="13" fill="#333">the file or log</text>
  <circle cx="450" cy="118" r="34" fill="#1e8e3e"/>
  <text x="450" y="123" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">1.0</text>
  <text x="450" y="176" text-anchor="middle" font-size="13" fill="#333">an agent first works</text>
  <text x="450" y="193" text-anchor="middle" font-size="13" fill="#333">it out in its own words</text>
  <circle cx="640" cy="118" r="26" fill="#2f6fdf"/>
  <text x="640" y="123" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">0.4</text>
  <text x="640" y="176" text-anchor="middle" font-size="13" fill="#333">a later note</text>
  <text x="640" y="193" text-anchor="middle" font-size="13" fill="#333">repeating it</text>
  <circle cx="810" cy="118" r="18" fill="#bdbdbd"/>
  <text x="810" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">0</text>
  <text x="810" y="176" text-anchor="middle" font-size="13" fill="#333">status board or</text>
  <text x="810" y="193" text-anchor="middle" font-size="13" fill="#333">anything else</text>
  <text x="30" y="262" font-size="18" font-weight="bold" fill="#222">2. Only the top of your list is read</text>
  <text x="30" y="286" font-size="13" fill="#333">Your pieces laid end to end, best first. Each costs its length in tokens (at least 64).</text>
    <rect x="50.0" y="330" width="43.0" height="34" rx="4" fill="#2f6fdf"/>
  <text x="71.5" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">1</text>
  <rect x="95.0" y="330" width="28.0" height="34" rx="4" fill="#7aa4ef"/>
  <text x="109.0" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">2</text>
  <rect x="125.0" y="330" width="16.0" height="34" rx="4" fill="#2f6fdf"/>
  <text x="132.0" y="352" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
  <rect x="143.0" y="330" width="58.0" height="34" rx="4" fill="#7aa4ef"/>
  <text x="172.0" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">4</text>
  <rect x="203.0" y="330" width="33.0" height="34" rx="4" fill="#2f6fdf"/>
  <text x="219.5" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">5</text>
  <rect x="238.0" y="330" width="88.0" height="34" rx="4" fill="#7aa4ef"/>
  <text x="282.0" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">6</text>
  <rect x="328.0" y="330" width="68.0" height="34" rx="4" fill="#2f6fdf"/>
  <text x="362.0" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">7</text>
  <rect x="398.0" y="330" width="118.0" height="34" rx="4" fill="#7aa4ef"/>
  <text x="457.0" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">8</text>
  <rect x="518.0" y="330" width="148.0" height="34" rx="4" fill="#2f6fdf"/>
  <text x="592.0" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">9</text>
  <rect x="668.0" y="330" width="178.0" height="34" rx="4" fill="#7aa4ef"/>
  <text x="757.0" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">10</text>
    <line x1="150.0" y1="312" x2="150.0" y2="382" stroke="#d93025" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="150.0" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#d93025">1,000</text>
  <line x1="250.0" y1="312" x2="250.0" y2="382" stroke="#d93025" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="250.0" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#d93025">2,000</text>
  <line x1="450.0" y1="312" x2="450.0" y2="382" stroke="#d93025" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="450.0" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#d93025">4,000</text>
  <line x1="850.0" y1="312" x2="850.0" y2="382" stroke="#d93025" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="850.0" y="306" text-anchor="middle" font-size="13" font-weight="bold" fill="#d93025">8,000</text>
  <text x="30" y="410" font-size="13" fill="#333">A piece that would cross a red line does not count for that line, but a smaller one after it still can.</text>
  <text x="30" y="430" font-size="13" fill="#333">Score = the average over the four lines, each compared with the best any list could do there.</text>
</svg>
