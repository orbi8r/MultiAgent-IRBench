<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="450" rx="16" fill="#ffffff"/>
  <text x="30" y="36" font-size="18" font-weight="bold" fill="#222">1. Your list is read from the top, and reading stops at 8,000 tokens</text>
  <text x="30" y="58" font-size="13" fill="#333">Each piece costs its length in tokens (at least 64). Here the question has one answer part, shown in green and orange.</text>
  <rect x="51.0" y="100" width="41.0" height="34" rx="4" fill="#7aa4ef"/>
  <rect x="94.0" y="100" width="26.0" height="34" rx="4" fill="#7aa4ef"/>
  <rect x="122.0" y="100" width="14.0" height="34" rx="4" fill="#7aa4ef"/>
  <rect x="138.0" y="100" width="56.0" height="34" rx="4" fill="#e8870e"/>
  <rect x="196.0" y="100" width="31.0" height="34" rx="4" fill="#7aa4ef"/>
  <rect x="229.0" y="100" width="86.0" height="34" rx="4" fill="#7aa4ef"/>
  <rect x="317.0" y="100" width="66.0" height="34" rx="4" fill="#7aa4ef"/>
  <rect x="385.0" y="100" width="116.0" height="34" rx="4" fill="#1e8e3e"/>
  <rect x="503.0" y="100" width="146.0" height="34" rx="4" fill="#7aa4ef"/>
  <rect x="651.0" y="100" width="136.0" height="34" rx="4" fill="#7aa4ef"/>
  <rect x="789.0" y="100" width="78.0" height="34" rx="4" fill="#bdbdbd" stroke="#888" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="150.0" y1="82" x2="150.0" y2="152" stroke="#d93025" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="150.0" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#d93025">1,000</text>
  <line x1="250.0" y1="82" x2="250.0" y2="152" stroke="#d93025" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="250.0" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#d93025">2,000</text>
  <line x1="450.0" y1="82" x2="450.0" y2="152" stroke="#d93025" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="450.0" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#d93025">4,000</text>
  <line x1="850.0" y1="82" x2="850.0" y2="152" stroke="#d93025" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="850.0" y="76" text-anchor="middle" font-size="13" font-weight="bold" fill="#d93025">8,000</text>
  <text x="50" y="172" font-size="12" fill="#333">green: states the whole answer.  orange: states only part of it.  blue: not the answer.</text>
  <text x="868" y="172" text-anchor="end" font-size="12" fill="#666">grey: crosses 8,000, so it is not read</text>
  <text x="30" y="208" font-size="18" font-weight="bold" fill="#222">2. The score is the average of four shares</text>
  <rect x="30" y="222" width="200" height="86" rx="10" fill="#e8f0fe" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="42" y="244" font-size="13" font-weight="bold" fill="#1a4fb0">after 1,000 tokens</text>
  <text x="42" y="263" font-size="12" fill="#333">nothing states it yet</text>
  <text x="42" y="298" font-size="12" fill="#333">main score share</text>
  <text x="218" y="298" text-anchor="end" font-size="20" font-weight="bold" fill="#1a4fb0">0.00</text>
  <text x="42" y="281" font-size="12" fill="#a85d00">half credit share 0.00</text>
  <rect x="245" y="222" width="200" height="86" rx="10" fill="#e8f0fe" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="257" y="244" font-size="13" font-weight="bold" fill="#1a4fb0">after 2,000 tokens</text>
  <text x="257" y="263" font-size="12" fill="#333">the orange piece is read</text>
  <text x="257" y="298" font-size="12" fill="#333">main score share</text>
  <text x="433" y="298" text-anchor="end" font-size="20" font-weight="bold" fill="#1a4fb0">1.00</text>
  <text x="257" y="281" font-size="12" fill="#a85d00">half credit share 0.50</text>
  <rect x="460" y="222" width="200" height="86" rx="10" fill="#e8f0fe" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="472" y="244" font-size="13" font-weight="bold" fill="#1a4fb0">after 4,000 tokens</text>
  <text x="472" y="263" font-size="12" fill="#333">still only the orange piece</text>
  <text x="472" y="298" font-size="12" fill="#333">main score share</text>
  <text x="648" y="298" text-anchor="end" font-size="20" font-weight="bold" fill="#1a4fb0">1.00</text>
  <text x="472" y="281" font-size="12" fill="#a85d00">half credit share 0.50</text>
  <rect x="675" y="222" width="200" height="86" rx="10" fill="#e8f0fe" stroke="#2f6fdf" stroke-width="1.5"/>
  <text x="687" y="244" font-size="13" font-weight="bold" fill="#1a4fb0">after 8,000 tokens</text>
  <text x="687" y="263" font-size="12" fill="#333">the green piece is read</text>
  <text x="687" y="298" font-size="12" fill="#333">main score share</text>
  <text x="863" y="298" text-anchor="end" font-size="20" font-weight="bold" fill="#1a4fb0">1.00</text>
  <text x="687" y="281" font-size="12" fill="#a85d00">half credit share 1.00</text>
  <text x="30" y="332" font-size="14" font-weight="bold" fill="#222">Main score = (0 + 1 + 1 + 1) / 4 = 0.75.   With half credit = (0 + 0.5 + 0.5 + 1) / 4 = 0.50.</text>
  <text x="30" y="352" font-size="14" fill="#333">With several parts the share is the fraction of parts found. The run score is the mean over all questions.</text>
  <text x="30" y="386" font-size="13" fill="#333">A part counts once a piece that states it has been read. Repeats of a piece count once.</text>
  <text x="30" y="406" font-size="13" fill="#333">The key lists the first statement, later copies and the raw tool output that shows it.</text>
  <text x="30" y="426" font-size="13" fill="#333">Who and history questions need the first statement, since its author and time are what was asked.</text>
</svg>
